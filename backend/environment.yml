name: iip-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - gdal>=3.7
  - libgdal
  - proj
  - osmium-tool>=1.15
  - pyosmium>=4.3.0
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.11.0
- geopandas>=0.14.0
  - rasterio>=1.3.0,<1.5   # pinned: 1.5.x Windows wheel DLL may be blocked by Application Control
  - shapely>=2.0.0
  - pyproj>=3.6.0
  - fiona>=1.9.0
  - scikit-image>=0.21.0
  - pip
  - pip:
    - rasterstats>=0.19.0
    - fastapi>=0.100.0
    - uvicorn[standard]>=0.23.0
    - pydantic>=2.0.0
    - python-dotenv>=1.0.0
    - httpx>=0.24.0
    - pyyaml>=6.0
    - requests>=2.31.0
    - tqdm>=4.66.0
    - pytest>=7.4.0
    - pytest-cov>=4.1.0
