  - osmium-tool>=1.15
  - libgdal
  - proj
  - pip
  - pip:
    - rasterio>=1.3.0
    - shapely>=2.0.0
    - geopandas>=0.14.0
    - pyproj>=3.6.0
    - fiona>=1.9.0
    - scikit-image>=0.21.0
    - scipy>=1.11.0
    - numpy>=1.24.0
    - pandas>=2.0.0
    - pyosmium>=3.6.0
    - rasterstats>=0.19.0
    - pyyaml>=6.0
    - requests>=2.31.0
    - tqdm>=4.66.0
    - pytest>=7.4.0
    - pytest-cov>=4.1.0
