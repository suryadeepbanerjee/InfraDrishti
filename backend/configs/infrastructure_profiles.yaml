    site_mcda_weights:
      site_area_ha:               0.05
      mean_slope_deg:             0.25
      dist_to_highway_m:          0.20
      acquisition_friction_index: 0.30
      population_within_1km:      0.05
      building_count:             0.10
      dist_to_water_m:            0.05
    site_mcda_directions:
      site_area_ha:               maximise
      mean_slope_deg:             minimise
      dist_to_highway_m:          minimise
      acquisition_friction_index: minimise
      population_within_1km:      minimise
      building_count:             minimise
      dist_to_water_m:            minimise

  data_center:
    description: "Data center (network/power proximity; stable flat terrain)"
    site_mcda_weights:
      site_area_ha:               0.05
      mean_slope_deg:             0.20
      dist_to_highway_m:          0.25
      acquisition_friction_index: 0.25
      population_within_1km:      0.10
      building_count:             0.10
      dist_to_water_m:            0.05
    site_mcda_directions:
      site_area_ha:               maximise
      mean_slope_deg:             minimise
      dist_to_highway_m:          minimise
      acquisition_friction_index: minimise
      population_within_1km:      minimise
      building_count:             minimise
      dist_to_water_m:            minimise

  solar_park:
    description: "Solar park (large flat area, high solar suitability, low AFI)"
    site_mcda_weights:
      site_area_ha:               0.30
      mean_slope_deg:             0.20
      dist_to_highway_m:          0.15
      acquisition_friction_index: 0.20
      population_within_1km:      0.05
      building_count:             0.05
      dist_to_water_m:            0.05
    site_mcda_directions:
      site_area_ha:               maximise
      mean_slope_deg:             minimise
      dist_to_highway_m:          minimise
      acquisition_friction_index: minimise
      population_within_1km:      minimise
      building_count:             minimise
      dist_to_water_m:            minimise
