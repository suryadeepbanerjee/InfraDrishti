# Infrastructure Intelligence Platform — AOI Configuration
# Demo: Latur–Osmanabad corridor, Maharashtra, India
#
# IMPORTANT: Both origin and destination must be inside the AOI bounding box.
# Verified: Latur (76.57E, 18.40N) and Osmanabad (76.04E, 18.18N) are both
# within [75.8, 17.9, 76.8, 18.6].

aoi:
  name: "Latur-Osmanabad Corridor, Maharashtra, India"
  description: >
    Demo AOI for Infrastructure Intelligence Platform. Covers the Latur and
    Osmanabad (Dharashiv) districts of Maharashtra on the Deccan plateau edge.
    Mixed cropland, moderate terrain, river systems (Man, Sina), moderate
    population density.

  # WGS84 bounding box [west, south, east, north]
  bbox_wgs84:
    west:  75.8
    south: 17.9
    east:  76.8
    north: 18.6

  # Projected CRS for all analysis
  crs_epsg: 32643
  crs_name: "WGS 84 / UTM zone 43N"

  # Grid specification
  resolution_m: 50

corridor_demo:
  infrastructure_type: "highway"
  profile: "highway"
  corridor_width_m: 500
  n_routes: 5

  # Origin: Latur city centre (confirmed within AOI bbox)
  origin:
    name: "Latur"
    lon: 76.57
    lat: 18.40

  # Destination: Osmanabad (Dharashiv) city centre (confirmed within AOI bbox)
  destination:
    name: "Osmanabad"
    lon: 76.04
    lat: 18.18

site_demo:
  infrastructure_type: "highway"
  profile: "highway"

  # Minimum site area: 50 acres (preferred) = 20.2343 ha = 202,343 m²
  # At 50m grid resolution: minimum 81 contiguous pixels
  required_area_acres: 50
  required_area_ha: 20.2343
  required_area_m2: 202343

  # Proximity constraints
  proximity_constraints:
    max_dist_to_highway_m: 5000   # Within 5 km of primary/secondary highway
    max_slope_deg: 15             # Hard constraint: slopes steeper than this are excluded
